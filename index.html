<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéApp Vanilla</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="view-login" class="view active">
        <div class="login-box">
            <h1>PokéApp</h1>
            <p>Ingresa para ver la Pokédex</p>
            <form id="login-form">
                <input type="text" placeholder="Usuario" required>
                <input type="password" placeholder="Contraseña" required>
                <button type="submit">Entrar / Registrarse</button>
            </form>
        </div>
    </section>

    <section id="view-list" class="view hidden">
        <header>
            <h2>Mi Pokédex</h2>
            <button id="btn-logout">Cerrar Sesión</button>
        </header>
        <div id="pokemon-grid" class="grid-container"></div> 
    </section>

    <section id="view-detail" class="view hidden">
        <header>
            <button id="btn-back">← Volver</button>
            <h2 id="detail-name">Cargando...</h2>
        </header>
        <div class="detail-container">
            <div class="img-wrapper">
                <img id="detail-image" src="" alt="Pokemon">
            </div>
            <div class="info-wrapper">
                <h3>Descripción</h3>
                <p id="detail-description">Cargando descripción...</p>
                <div class="badges" id="detail-types"></div>
            </div>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
